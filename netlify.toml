[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--version" # uncomment if using pnpm to skip npm install

[build]
  base = "docs/"
  ignore = "git diff --quiet 'HEAD^' HEAD -- ':(top)docs' ':(top)netlify.toml' ':(top)package.json' ':(top)pnpm-lock.yaml' ':(top)pnpm-workspace.yaml'"
  publish = ".vitepress/dist"
  command = "npx pnpm@12 i --store=node_modules/.pnpm-store && npx pnpm@12 run build"
